# The backend reads arguments from variables of the same name, so each
# argument is passed as $<argumentName>.

fragment PersonSummary on Person {
  id
  name
  age
  yearMet
  lastContactedAt
  contactDueAt
  contactState
  isActive
  status {
    id
    name
  }
  recordedMilestoneIds
  activeBurdenCount
  latestComment {
    id
    content
    createdAt
    author {
      id
      name
    }
    prayerBurden {
      id
    }
  }
  shepherds {
    id
    name
  }
}

# The lists a contact changes: logging one adds a contact, its note and maybe
# a burden, and Undo removes them. The Person query and LogContact/DeleteContact
# all select it, so the mutation results update the Person page's cache.
# contactLogId marks a note written by logging a contact.
fragment PersonActivity on Person {
  id
  prayerBurdens {
    id
    content
    releasedDate
    createdAt
  }
  comments {
    id
    content
    createdAt
    contactLogId
    author {
      id
      name
    }
    prayerBurden {
      id
    }
  }
  contacts {
    id
    contactedAt
    isFollowUp
    createdAt
  }
}

query Me {
  me {
    id
    name
    username
  }
}

query MyPeople {
  myPeople {
    ...PersonSummary
  }
}

# Overdue and due-soon people (business rule 6), most urgent first.
query ContactAlerts {
  contactAlerts {
    ...PersonSummary
  }
}

# milestones, prayerBurdens, comments and contacts are only loaded by
# `person` and mutations returning Person; never select them on myPeople
# or contactAlerts (PersonSummary's counts and latestComment cover those).
query Person($id: UUID!) {
  person(id: $id) {
    ...PersonSummary
    milestones {
      id
      dateAchieved
      notes
      milestone {
        id
        name
      }
      recordedBy {
        id
        name
      }
    }
    ...PersonActivity
  }
}

query Statuses {
  statuses {
    id
    name
  }
}

query Milestones {
  milestones {
    id
    name
    description
  }
}

mutation Login($input: LoginInput!) {
  login(input: $input) {
    token
    user {
      id
      name
      username
    }
  }
}

mutation Register($input: RegisterInput!) {
  register(input: $input) {
    token
    user {
      id
      name
      username
    }
  }
}

mutation CreatePerson($input: CreatePersonInput!) {
  createPerson(input: $input) {
    ...PersonSummary
  }
}

mutation RecordMilestone($input: RecordMilestoneInput!) {
  recordMilestone(input: $input) {
    id
  }
}

# milestoneId is the milestone type's id, not the MilestonePerson row's.
mutation RemoveMilestone($personId: UUID!, $milestoneId: UUID!) {
  removeMilestone(personId: $personId, milestoneId: $milestoneId)
}

mutation CreatePrayerBurden($input: CreatePrayerBurdenInput!) {
  createPrayerBurden(input: $input) {
    id
  }
}

mutation ReleasePrayerBurden($id: UUID!) {
  releasePrayerBurden(id: $id) {
    id
  }
}

mutation CreateComment($input: CreateCommentInput!) {
  createComment(input: $input) {
    id
  }
}

mutation DeleteComment($id: UUID!) {
  deleteComment(id: $id)
}

# Selects PersonSummary so the cache updates the person, and any MyPeople
# entry for them, without a refetch.
mutation UpdatePerson($id: UUID!, $input: UpdatePersonInput!) {
  updatePerson(id: $id, input: $input) {
    ...PersonSummary
  }
}

# Removes the person for every shepherd, with their milestones, burdens and
# comments.
mutation DeletePerson($id: UUID!) {
  deletePerson(id: $id)
}

mutation UnassignPerson($personId: UUID!, $userId: UUID!) {
  unassignPerson(personId: $personId, userId: $userId) {
    id
    shepherds {
      id
      name
    }
  }
}

# Every active burden across the user's people, newest first, with whose it is.
query ActivePrayerBurdens {
  activePrayerBurdens {
    id
    content
    createdAt
    person {
      id
      name
    }
  }
}

query SearchUsers($query: String!) {
  searchUsers(query: $query) {
    id
    name
    username
  }
}

mutation AssignPerson($personId: UUID!, $userId: UUID!) {
  assignPerson(personId: $personId, userId: $userId) {
    id
    shepherds {
      id
      name
    }
  }
}

# Returns the person with their new contact state (and status, since a
# follow-up promotes a new contact to active). contacts are ordered by
# contactedAt, so a back-dated contact may not be contacts[0]; the one just
# logged has the latest createdAt.
mutation LogContact($input: LogContactInput!) {
  logContact(input: $input) {
    ...PersonSummary
    ...PersonActivity
  }
}

# Also moves the person back to new contact if this contact promoted them and
# they are still active.
mutation DeleteContact($id: UUID!) {
  deleteContact(id: $id) {
    ...PersonSummary
    ...PersonActivity
  }
}
