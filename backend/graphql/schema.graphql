# ============================================================
# Shepherd My Sheep — GraphQL Schema
# ============================================================
#
# Nullability rules (from business logic):
#   - Lists ([Type!]!) are always non-null but may be EMPTY.
#     A new user has no people. A new person has no milestones,
#     no prayer burdens, and no comments.
#   - Optional scalars (no !) may be null:
#     Comment.prayerBurden, Person.age, Person.yearMet, etc.
#
# Errors: every entry in errors[] carries extensions.code:
#   UNAUTHENTICATED (also HTTP 401), NOT_FOUND (missing or not yours;
#   deliberately indistinguishable), CONFLICT (already exists, or changed since),
#   BAD_USER_INPUT (message is safe to show), UNAVAILABLE (busy, retry),
#   INTERNAL (generic message; details only in server logs).

# ── Scalars ──────────────────────────────────────────────────
scalar DateTime
scalar Date
scalar UUID

# ── Core Types ───────────────────────────────────────────────

type User {
  id: UUID!
  name: String!
  username: String!
  people: [Person!]!              # may be empty for a new user
  createdAt: DateTime!
  updatedAt: DateTime!
}

type Person {
  id: UUID!
  name: String!
  age: Int                        # nullable — may not be known
  yearMet: Int                    # nullable
  lastContactDate: Date @deprecated(reason: "Use lastContactedAt.")  # date part of lastContactedAt
  lastContactedAt: DateTime       # nullable — latest logged contact
  contactDueAt: DateTime          # nullable — null when contactState is NOT_TRACKED
  contactClockStart: DateTime     # nullable — when the current contact window started (last contact, when added, or a status move); null when NOT_TRACKED
  contactState: ContactState!
  isActive: Boolean!
  status: Status!
  statusChangedAt: DateTime       # nullable — when the status was last moved by hand; null until then. Names the move for undoStatusChange
  # Summaries, loaded everywhere a Person is returned (myPeople and
  # contactAlerts too), so list screens don't need the nested lists.
  recordedMilestoneIds: [UUID!]!  # ids of the Milestones recorded, in no set order; may be empty. Steps can be reached out of order
  activeBurdenCount: Int!         # prayer burdens not yet released; may be 0
  latestComment: Comment          # nullable — newest comment of any kind (standalone, contact note, or on a burden)
  lastPrayer: PrayerLog           # nullable — no one has prayed yet. Latest by prayedAt, so a back-dated record may not be the newest one made
  shepherds: [User!]!             # who is caring for this person; loaded everywhere a Person is returned
  # Loaded only by person / mutations returning Person; never select them on myPeople or contactAlerts.
  milestones: [MilestonePerson!]! # may be empty for a new contact
  prayerBurdens: [PrayerBurden!]! # may be empty
  comments: [Comment!]!           # may be empty
  contacts: [ContactLog!]!        # may be empty; newest first
  prayers: [PrayerLog!]!          # may be empty; every record, newest prayedAt first. Shared by all the person's shepherds
  createdAt: DateTime!
  updatedAt: DateTime!
}

# Contact cadence (business rule 6): 'active' people are due every 7 days,
# a 'new contact' within 72 hours (counted from when they were added if no
# contact is logged, or from a status move if that is later). Adding someone is the first contact, so any contact
# logged for a 'new contact' is their follow-up. Due soon = within 48h (active) or 24h (new contact)
# of the deadline. Other statuses are NOT_TRACKED.
enum ContactState {
  OVERDUE
  DUE_SOON
  ON_TRACK
  NOT_TRACKED
}

type ContactLog {
  id: UUID!
  contactedBy: User               # nullable — unknown for imported history, or the user was deleted
  contactedAt: DateTime!
  isFollowUp: Boolean!            # true for the contact that followed up a 'new contact'
  note: String                    # nullable — the standalone note (Comment) written with it; gone if the contact is deleted. Null only for imported history
  createdAt: DateTime!
}

# A shepherd praying for the person. Not a contact: it doesn't change the contact state.
type PrayerLog {
  id: UUID!
  prayedBy: User                  # nullable — the user was deleted (their records stay)
  prayedAt: DateTime!             # when they prayed; earlier than createdAt for a back-dated record
  createdAt: DateTime!            # when it was recorded
}

type Status {
  id: UUID!
  name: String!
}

type Milestone {
  id: UUID!
  name: String!
  description: String             # nullable
}

type MilestonePerson {
  id: UUID!
  milestone: Milestone!
  person: Person!
  dateAchieved: Date              # nullable — might not know exact date
  notes: String                   # nullable
  recordedBy: User                # nullable — user could be deleted
  createdAt: DateTime!
}

type PrayerBurden {
  id: UUID!
  person: Person!                 # only id, name and status are filled, and only where a root field returns the burden; under Person.prayerBurdens use the parent, and a burden inside a Comment has no person
  content: String!
  releasedDate: DateTime          # null = still active
  comments: [Comment!]!           # newest first; may be empty (a burden needs no comments); not filled on a burden inside a Comment
  createdAt: DateTime!
  updatedAt: DateTime!
}

type Comment {
  id: UUID!
  author: User!
  person: Person!
  prayerBurden: PrayerBurden      # nullable — comment may be a standalone note
  contactLogId: UUID              # nullable — set when the note was written by logging a contact (shown as "Logged contact")
  content: String!
  createdAt: DateTime!
  updatedAt: DateTime!
}

# ── Auth ─────────────────────────────────────────────────────

type AuthPayload {
  token: String!
  user: User!
}

# ── Queries ──────────────────────────────────────────────────

type Query {
  # Auth
  me: User!

  # People
  person(id: UUID!): Person       # nullable — may not exist
  myPeople: [Person!]!            # may be empty

  # Your people who are OVERDUE or DUE_SOON, most urgent first — may be empty.
  contactAlerts: [Person!]!

  # Lookups
  statuses: [Status!]!
  milestones: [Milestone!]!

  # Other users whose name or username contains `query` (case-insensitive),
  # for adding a shepherd. Excludes the caller; at most 10; a query under
  # 2 characters returns [] — may be empty.
  searchUsers(query: String!): [User!]!

  # Prayer burdens — optionally filter by person; each with its person (id, name, status) and its comments
  activePrayerBurdens(personId: UUID): [PrayerBurden!]!

  # Your people's 5 most recently released burdens, of any age, newest release first — may be empty;
  # optionally filter by person; each with its person (id, name, status) and its comments
  recentlyReleasedPrayerBurdens(personId: UUID): [PrayerBurden!]!
}

# ── Mutations ────────────────────────────────────────────────

type Mutation {
  # Auth
  register(input: RegisterInput!): AuthPayload!
  login(input: LoginInput!): AuthPayload!

  # People
  createPerson(input: CreatePersonInput!): Person!
  updatePerson(id: UUID!, input: UpdatePersonInput!): Person!
  # Undo of a status move: puts back the status and the contact clock from
  # before it, rather than restarting the clock as a move back would. Name
  # the move by the status it set and its statusChangedAt. One level only.
  # CONFLICT if the person has moved or been promoted since, or was never moved.
  undoStatusChange(personId: UUID!, statusId: UUID!, statusChangedAt: DateTime!): Person!
  deletePerson(id: UUID!): Boolean!
  assignPerson(personId: UUID!, userId: UUID!): Person!
  unassignPerson(personId: UUID!, userId: UUID!): Person!

  # Milestones
  recordMilestone(input: RecordMilestoneInput!): MilestonePerson!
  removeMilestone(personId: UUID!, milestoneId: UUID!): Boolean!

  # Prayer Burdens
  createPrayerBurden(input: CreatePrayerBurdenInput!): PrayerBurden!
  releasePrayerBurden(id: UUID!): PrayerBurden!
  unreleasePrayerBurden(id: UUID!): PrayerBurden!  # Undo of a release; NOT_FOUND if it isn't released or isn't yours

  # Comments
  createComment(input: CreateCommentInput!): Comment!
  deleteComment(id: UUID!): Boolean!

  # Contacts — both return the person with their updated contact state.
  # Logging a contact for a 'new contact' is their follow-up and moves them
  # to 'active'. Deleting a contact also deletes its note and prayer burden,
  # and moves the person back to 'new contact' if this contact promoted them
  # and they are still 'active'.
  logContact(input: LogContactInput!): Person!
  deleteContact(id: UUID!): Person!

  # Prayer — both return the person with their updated lastPrayer and prayers.
  # Each call is its own record. prayedAt is optional (now); it may be earlier
  # (back-dated) but not more than 5 minutes in the future (BAD_USER_INPUT).
  # Only the shepherd who recorded a prayer may delete it; anyone else gets NOT_FOUND.
  recordPrayer(personId: UUID!, prayedAt: DateTime): Person!
  deletePrayer(id: UUID!): Person!
}

# ── Inputs ───────────────────────────────────────────────────

input RegisterInput {
  name: String!
  username: String!
  password: String!
}

input LoginInput {
  username: String!
  password: String!
}

input CreatePersonInput {
  name: String!
  age: Int                        # optional
  yearMet: Int                    # optional
  statusId: UUID!
  comment: String                 # optional — saved as a standalone note (Comment) by the creator; blank is ignored
}

input UpdatePersonInput {
  name: String                    # all optional — only update what's provided
  age: Int
  yearMet: Int
  lastContactDate: Date @deprecated(reason: "Use logContact.")  # logs a contact on that date
  isActive: Boolean
  statusId: UUID
}

input RecordMilestoneInput {
  personId: UUID!
  milestoneId: UUID!
  dateAchieved: Date              # optional
  notes: String                   # optional
}

input CreatePrayerBurdenInput {
  personId: UUID!
  content: String!
}

input CreateCommentInput {
  personId: UUID!
  prayerBurdenId: UUID            # optional — null means standalone note
  content: String!
}

# What the "Log contact" modal sends.
input LogContactInput {
  personId: UUID!
  contactedAt: DateTime!          # clients default it to the device's current time; may not be in the future
  note: String!                   # what was talked about; must not be blank. Saved as a standalone note (Comment) on the person, linked to this contact
  prayerBurden: String            # optional — saved as a prayer burden on the person, linked to this contact; blank is ignored
  isFollowUp: Boolean @deprecated(reason: "Ignored. A contact for a 'new contact' is always their follow-up.")
}
