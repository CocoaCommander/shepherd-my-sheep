# The backend reads arguments from variables of the same name, so each
# argument is passed as $<argumentName>.

query Me {
  me {
    ...UserFields
  }
}

query MyPeople {
  myPeople {
    ...PersonSummary
  }
}

query ContactAlerts {
  contactAlerts {
    ...PersonSummary
  }
}

query Person($id: UUID!) {
  person(id: $id) {
    ...PersonDetail
  }
}

query Statuses {
  statuses {
    id
    name
  }
}

query Milestones {
  milestones {
    id
    name
    description
  }
}

query SearchUsers($query: String!) {
  searchUsers(query: $query) {
    id
    name
    username
  }
}

query ActivePrayerBurdens($personId: UUID) {
  activePrayerBurdens(personId: $personId) {
    ...PrayerListBurden
  }
}

# The latest 5 releases, of any age, newest release first.
query RecentlyReleasedPrayerBurdens($personId: UUID) {
  recentlyReleasedPrayerBurdens(personId: $personId) {
    ...PrayerListBurden
  }
}
