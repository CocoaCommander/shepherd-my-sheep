# The backend reads arguments from variables of the same name, so each
# argument is passed as $<argumentName>.

query Me {
  me {
    ...UserFields
  }
}

query MyPeople {
  myPeople {
    ...PersonSummary
  }
}

query ContactAlerts {
  contactAlerts {
    ...PersonSummary
  }
}

query Person($id: UUID!) {
  person(id: $id) {
    ...PersonDetail
  }
}

query Statuses {
  statuses {
    id
    name
  }
}

query Milestones {
  milestones {
    id
    name
    description
  }
}

query SearchUsers($query: String!) {
  searchUsers(query: $query) {
    id
    name
    username
  }
}

# `person` is selected here and not in PrayerBurdenFields: only
# activePrayerBurdens fills it, and other operations would get null.
query ActivePrayerBurdens($personId: UUID) {
  activePrayerBurdens(personId: $personId) {
    ...PrayerBurdenFields
    person {
      id
      name
    }
  }
}
