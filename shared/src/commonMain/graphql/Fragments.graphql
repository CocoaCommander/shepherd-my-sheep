# Shared selections, so every operation maps to the domain models the
# same way. The backend loads Person's nested lists only for `person`
# and for mutations returning a single Person, so only those operations
# may select PersonDetail. myPeople and contactAlerts select PersonSummary.

fragment UserFields on User {
  id
  name
  username
  createdAt
  updatedAt
}

fragment PersonSummary on Person {
  id
  name
  age
  yearMet
  isActive
  status {
    id
    name
  }
  # Contact cadence (business rule 6), computed by the server. Clients
  # show it as given and never recompute it.
  contactState
  contactDueAt
  contactClockStart
  lastContactedAt
  createdAt
}

fragment PrayerBurdenFields on PrayerBurden {
  id
  content
  releasedDate
  createdAt
  updatedAt
}

# A burden as the prayer-list queries and burden mutations return it.
# The server fills only id, name and status on its person; any other
# Person field selected here would come back null. Under
# PersonDetail.prayerBurdens use PrayerBurdenFields: the parent is known.
fragment PrayerListBurden on PrayerBurden {
  ...PrayerBurdenFields
  person {
    id
    name
    status {
      id
      name
    }
  }
  # Newest first; may be empty.
  comments {
    ...CommentFields
  }
}

fragment CommentFields on Comment {
  id
  content
  createdAt
  updatedAt
  author {
    ...UserFields
  }
  prayerBurden {
    id
  }
  contactLogId
}

fragment MilestonePersonFields on MilestonePerson {
  id
  dateAchieved
  notes
  createdAt
  milestone {
    id
    name
    description
  }
  recordedBy {
    ...UserFields
  }
}

fragment ContactLogFields on ContactLog {
  id
  contactedAt
  isFollowUp
  createdAt
  contactedBy {
    ...UserFields
  }
}

fragment PersonDetail on Person {
  ...PersonSummary
  shepherds {
    ...UserFields
  }
  milestones {
    ...MilestonePersonFields
  }
  prayerBurdens {
    ...PrayerBurdenFields
  }
  comments {
    ...CommentFields
  }
  contacts {
    ...ContactLogFields
  }
}
