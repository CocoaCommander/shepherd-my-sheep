name: Lint

on:
  pull_request:
  push:
    branches: [main]

jobs:
  pre-commit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1

      - uses: actions/setup-node@v7.1.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci

      - uses: actions/setup-java@v6.0.1
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v6.4.0
        with:
          gradle-version: 9.8.1

      - uses: actions/setup-python@v7.0.0
        with:
          python-version: '3.12'
      - run: pip install pre-commit==4.6.0

      # gitleaks only scans staged changes, so it runs as its own job below.
      - run: pre-commit run --all-files --show-diff-on-failure
        env:
          SKIP: gitleaks

  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
      - name: gitleaks (full history)
        run: >
          docker run --rm -v "$PWD:/repo" ghcr.io/gitleaks/gitleaks:v8.30.1
          git /repo --redact --config /repo/.gitleaks.toml

  # Also enforced by the forbid-env-files pre-commit hook, but that only sees
  # the final tree; this checks every commit, so a .env added and then deleted
  # within a branch is still caught.
  env-files:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
      - name: no .env files in history
        run: |
          found=$(git log --all --pretty=format: --name-only \
            | grep -E '(^|/)\.env(\..+)?$' | grep -vE '(^|/)\.env\.example$' | sort -u)
          if [ -n "$found" ]; then
            echo "::error::.env files must never be committed (only .env.example is allowed):"
            echo "$found"
            exit 1
          fi

  clang-tidy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - run: docker build --target lint backend
