services:
  db:
    image: postgres:16-alpine
    container_name: sms-postgres
    restart: unless-stopped
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    env_file: .env
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./db/migrations:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER"]
      interval: 5s
      timeout: 3s
      retries: 5

  api:
    build:
      context: ./backend
    container_name: sms-api
    restart: unless-stopped
    env_file: .env
    environment:
      # Two values from .env describe the *host* view and must be
      # overridden inside the compose network:
      #
      #   POSTGRES_HOST — on the host (and for the pytest suite) the DB is
      #   reachable at localhost; from this container it is the service
      #   name "db".
      #
      #   API_HOST — the server must bind 0.0.0.0 to accept traffic from
      #   outside the container. Binding localhost would make the
      #   published port unreachable.
      POSTGRES_HOST: db
      POSTGRES_PORT: 5432
      API_HOST: 0.0.0.0
    ports:
      - "${API_PORT}:${API_PORT}"
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
